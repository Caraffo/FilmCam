name: Build APK

# Compila la APK en cada push a master que toque la app y la publica en el
# release "apk-latest" junto con update.json, que la app consulta para
# actualizarse sola.
on:
  push:
    branches: [master]
    paths:
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "shaders/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true

      # Misma clave con la que está firmada la app instalada, así cada
      # versión se instala encima sin perder datos. Si la clave no es la
      # esperada, el build falla en vez de publicar una APK que no instala.
      - name: Signing key
        env:
          EXPECTED_SHA256: "13:8A:C2:5E:D2:09:48:2A:1B:65:CD:9F:1E:17:98:72:B7:0C:A1:AC:07:34:E8:8B:E4:94:52:1B:80:70:B2:2B"
        run: |
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > "${RUNNER_TEMP}/filmcam.keystore"
          actual=$(keytool -list -v -keystore "${RUNNER_TEMP}/filmcam.keystore" -storepass android -alias androiddebugkey | grep "SHA256:" | awk '{print $2}')
          echo "Clave: ${actual}"
          test "${actual}" = "${EXPECTED_SHA256}"
          echo "FILMCAM_KEYSTORE=${RUNNER_TEMP}/filmcam.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --build-name="1.0.${GITHUB_RUN_NUMBER}"
          cp build/app/outputs/flutter-apk/app-release.apk filmcam-latest.apk
          # La APK publicada tiene que estar firmada con la clave esperada.
          "${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner" \
            verify --print-certs filmcam-latest.apk | grep -i "SHA-256 digest: 138ac25ed209482a1b65cd9f1e179872b70ca1ac0734e88be494521b8070b22b"
          cat > update.json <<JSON
          {
            "buildNumber": ${GITHUB_RUN_NUMBER},
            "versionName": "1.0.${GITHUB_RUN_NUMBER}",
            "commit": "${GITHUB_SHA}"
          }
          JSON
          cat update.json

      - name: Publish apk-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes="Build #${GITHUB_RUN_NUMBER} · ${GITHUB_SHA}. Instalá filmcam-latest.apk; después la app se actualiza sola."
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release edit apk-latest --title "FilmCam (última)" --target "${GITHUB_SHA}" --latest --notes "${notes}"
          else
            gh release create apk-latest --title "FilmCam (última)" --target "${GITHUB_SHA}" --latest --notes "${notes}"
          fi
          gh release upload apk-latest filmcam-latest.apk update.json --clobber
